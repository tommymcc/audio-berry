[package]
name = "audio-berry"
version = "0.1.0"
edition = "2024"
license = "MIT"

[features]
default = ["cuda"]
cuda = ["any-tts/cuda"]
metal = ["any-tts/metal"]

[dependencies]
# The integration branch of the fork, which has native OmniVoice voice cloning.
any-tts = { git = "https://github.com/tommymcc/any-tts", rev = "d92eef45315791ef67f0e896ecb776488fdc93bd", default-features = false, features = ["omnivoice", "download"] }
candle-core = "0.10.2"
candle-nn = "0.10.2"
candle-transformers = "0.10.2"
# Noise cleaning for voice samples: DeepFilterNet 3, built in, run on the CPU with tract.
deep_filter = { git = "https://github.com/Rikorose/DeepFilterNet", tag = "v0.5.6", default-features = false, features = ["tract", "default-model"] }
epub = "2"
flate2 = "1"
mdns-sd = "0.21"
# The version deep_filter uses, for passing audio to it.
ndarray = "0.15"
rust_cast = "0.21"
rustls = { version = "0.23", default-features = false, features = ["ring"] }
scraper = "0.29.0"
serde_json = "1"
tokenizers = "0.22.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
