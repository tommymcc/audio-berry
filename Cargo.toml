[package]
name = "audio-berry"
version = "0.1.0"
edition = "2024"
license = "MIT"

[features]
default = ["cuda"]
cuda = ["any-tts/cuda"]
metal = ["any-tts/metal"]

[dependencies]
# The integration branch of the fork, which has native OmniVoice voice cloning.
any-tts = { git = "https://github.com/tommymcc/any-tts", rev = "d92eef45315791ef67f0e896ecb776488fdc93bd", default-features = false, features = ["omnivoice", "download"] }
candle-core = "0.10.2"
candle-nn = "0.10.2"
candle-transformers = "0.10.2"
epub = "2"
flate2 = "1"
mdns-sd = "0.21"
rust_cast = "0.21"
rustls = { version = "0.23", default-features = false, features = ["ring"] }
scraper = "0.29.0"
serde_json = "1"
tokenizers = "0.22.2"
