[package]
name = "audio-berry"
version = "0.1.0"
edition = "2024"

[features]
default = ["cuda"]
cuda = ["any-tts/cuda"]

[dependencies]
any-tts = { version = "0.2", default-features = false, features = ["vibevoice", "download"] }
mdns-sd = "0.21"
rust_cast = "0.21"
rustls = { version = "0.23", default-features = false, features = ["ring"] }

# Local fix: reference audio must be cast to the model dtype on CUDA (BF16).
[patch.crates-io]
any-tts = { path = "vendor/any-tts" }
