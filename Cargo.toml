[package]
name = "audio-berry"
version = "0.1.0"
edition = "2024"
license = "MIT"

[features]
default = ["cuda"]
cuda = ["any-tts/cuda", "parakeet-rs/cuda"]
metal = ["any-tts/metal", "parakeet-rs/coreml"]
# The checker on any GPU through Vulkan, with burn instead of ONNX Runtime.
# Speech still runs on the CPU.
vulkan = ["parakeet-rs/vulkan"]
# AMD GPUs through ROCm, with burn: OmniVoice's backbone (the rest of OmniVoice
# runs on the CPU) and the checker. See docs/amd-gpu.md.
rocm = ["any-tts/rocm", "parakeet-rs/burn-rocm"]

[dependencies]
# The fork's rocm-burn branch: the integration branch, which has native OmniVoice
# voice cloning, plus the `rocm` feature.
any-tts = { git = "https://github.com/tommymcc/any-tts", rev = "ad03f0a70a44294571d419e0707d41ba2b2bec27", default-features = false, features = ["omnivoice", "download"] }
clap = { version = "4.6", features = ["derive", "env"] }
color-eyre = { version = "0.6.5", default-features = false, features = ["track-caller"] }
# Noise cleaning for voice samples: DeepFilterNet 3, built in, run on the CPU with tract.
deep_filter = { git = "https://github.com/Rikorose/DeepFilterNet", tag = "v0.5.6", default-features = false, features = ["tract", "default-model"] }
epub = "2"
fs-err = "3.3.2"
indicatif = "0.18"
mdns-sd = "0.21"
# Parakeet TDT, which checks takes, on ONNX Runtime.
parakeet-rs = "0.4.4"
# The version deep_filter uses, for passing audio to it.
ndarray = "0.15"
# Already built for deep_filter; the autocorrelation in pitch tracking.
realfft = "3.5"
rust_cast = "0.21"
rustls = { version = "0.23", default-features = false, features = ["ring"] }
scraper = "0.29.0"
serde_json = "1"
# The version any-tts uses, for estimating audio length as it does.
unicode-general-category = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Fixes in forks, not yet sent upstream.
[patch.crates-io]
# gemm 0.19 runs its FMA kernels on CPUs with FMA but not AVX2, such as AMD's FX,
# and panics, as they need AVX2 too. candle and burn's CPU backend both use it.
gemm-common = { git = "https://github.com/tommymcc/gemm", rev = "dbdcb05011089a25f1b4d34e89eee4504b61f605" }
gemm-f16 = { git = "https://github.com/tommymcc/gemm", rev = "dbdcb05011089a25f1b4d34e89eee4504b61f605" }
# pliron 0.19 (under burn's cubecl, for `vulkan`) asks for any hashbrown 0.x, gets
# 0.11, and fails to build. 0.20 fixed it, but cubecl 0.11 needs 0.19.
pliron = { git = "https://github.com/tommymcc/pliron", rev = "ac2cc0c820907013df7d955be7da370a7b8b2c2f" }
# cubecl-hip-sys (under burn's ROCm backend, for `rocm`) has no bindings for
# Ubuntu 26.04's own HIP, 7.1.52801, so it builds with none and cubecl-hip fails.
cubecl-hip-sys = { git = "https://github.com/tommymcc/cubecl-hip-sys", rev = "26e8dea1b9ae2a362f28ed2aadf67f25d2022acb" }
